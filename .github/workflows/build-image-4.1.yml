name: Build & publish 4.1 image

# SPT 4.1 is the living branch. This image is DERIVED from the official
# ghcr.io/sp-tarkov/server-csharp image (already multi-arch) and only re-lays-out the
# filesystem so the bind mount is the game root — see image-4.1/Dockerfile.
#
# Published as its own package (spt-fika-server-4.1.x). The 4.0 package
# (spt-fika-server, incl. its :latest) is frozen at 4.0.13 and is NOT touched here, so
# nobody running 4.0 gets moved to 4.1 by a pull.
#
# To publish: Actions tab → this workflow → "Run workflow" → pick the branch that has
# image-4.1/ (UI-Configurator). Auth is the built-in GITHUB_TOKEN — no PAT.

on:
  workflow_dispatch:
    inputs:
      spt_version:
        description: "SPT 4.1.x version — a published tag of ghcr.io/sp-tarkov/server-csharp (e.g. 4.1.0)"
        required: true
        default: "4.1.0"
      spt_release:
        description: "SPT release id for the client scaffold — <ver>-<build>-<hash> (e.g. 4.1.0-40743-e18bd1e). Bump WITH spt_version."
        required: true
        default: "4.1.0-40743-e18bd1e"
      tag_latest:
        description: "Also tag :latest on the 4.1.x package"
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE: dildz/spt-fika-server-4.1.x

jobs:
  # Build each arch on its own native runner, push by digest (no tag yet).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub's native arm64 runner (free on public repos)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./image-4.1
          platforms: ${{ matrix.platform }}
          build-args: |
            SPT_VERSION=${{ inputs.spt_version }}
            SPT_RELEASE=${{ inputs.spt_release }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the two per-arch digests into one multi-arch tag.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create & push manifest list
        working-directory: /tmp/digests
        run: |
          tags="-t ${REGISTRY}/${IMAGE}:${{ inputs.spt_version }}"
          if [ "${{ inputs.tag_latest }}" = "true" ]; then
            tags="$tags -t ${REGISTRY}/${IMAGE}:latest"
          fi
          docker buildx imagetools create $tags \
            $(for d in *; do printf '%s@sha256:%s ' "${REGISTRY}/${IMAGE}" "$d"; done)

      - name: Show published manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${{ inputs.spt_version }}"
